<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e8ed"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>EasyLoop</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#705363;background:#fcf8f9}*{box-sizing:border-box}body{margin:0}header{background:#f5e5eb;padding:25px 18px 16px;position:sticky;top:0;z-index:2;border-bottom:1px solid #ecd9e1}.wrap{max-width:680px;margin:auto;padding:16px 16px 100px}h1{margin:0;font-size:26px}h2{font-size:19px;margin:6px 0 14px}h3{margin:0 0 10px}small,.muted{color:#997b89}.card{background:white;border:1px solid #efdee5;border-radius:19px;padding:17px;margin-bottom:13px;box-shadow:0 2px 10px #b78a9b0c}.soft{background:#f7e9ee}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#ac768c;color:white;border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:650;cursor:pointer}.btn.secondary{background:#f4e5eb;color:#80596b}.btn.outline{background:white;border:1px solid #d5aebf;color:#80596b}.btn:disabled{opacity:.4}.btn.full{width:100%}input,select,textarea{width:100%;border:1px solid #e4cdd7;background:#fff;border-radius:12px;padding:12px;color:#705363;font:inherit;margin-top:5px}label{display:block;font-size:13px;font-weight:650;margin:12px 0}.big{font-size:38px;font-weight:750}.pill{background:#f2dce5;color:#91657a;border-radius:30px;padding:5px 9px;font-size:12px}.step{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #ead8e0;border-radius:13px;margin:8px 0;cursor:pointer}.step.done{background:#edf4ed;text-decoration:line-through}.step input{width:20px;height:20px;margin:0;accent-color:#ab758b}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead8e0;display:flex;justify-content:center;z-index:3;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;max-width:220px;padding:14px 5px;border:0;background:white;color:#947384;font-size:13px}.tabs button.active{color:#965b74;font-weight:750}.progress{height:9px;background:#f0dce5;border-radius:20px;overflow:hidden}.progress span{display:block;background:#ba8599;height:100%}.warn{background:#fff4ef;border:1px solid #eac4b4;border-radius:14px;padding:13px}.ok{color:#437b57}.danger{color:#a05a42}.link{color:#9e6680;text-decoration:underline;cursor:pointer}.tag{font-size:11px;letter-spacing:1px;color:#ad8192;font-weight:750}.notice{font-size:12px;line-height:1.5;color:#8b7080}.photo{width:64px;height:64px;object-fit:cover;border-radius:12px}details{margin:10px 0}summary{cursor:pointer;font-weight:650} .space{height:8px}
</style></head><body><header><div style="max-width:680px;margin:auto"><div class="tag">♡ YOUR COZY CRAFT COMPANION</div><h1>EasyLoop <span style="font-size:17px">🧶</span></h1></div></header><main class="wrap" id="app"></main><nav class="tabs"><button id="tab-projects" onclick="go('projects')">♡ Progetti</button><button id="tab-work" onclick="go('work')">◉ Lavora</button><button id="tab-library" onclick="go('library')">▤ Pattern</button><button id="tab-settings" onclick="go('settings')">⚙ Backup</button></nav><script>
const KEY='easyloop-v1';const initial={selected:'sophie',projects:[{id:'sophie',name:'Sophie Scarf — esempio',status:'In corso',row:1,initial:6,interval:8,increases:15,offset:8,kind:'increase',technique:'KFB (da verificare)',before:'K2',after:'Knit fino alle ultime 3 maglie; slip 3 purlwise con filo davanti (da verificare)',regular:'Knit fino alle ultime 3 maglie; slip 3 purlwise con filo davanti (da verificare)',notes:'Schema dimostrativo PERSONALIZZATO: non è una trascrizione verificata del tutorial o del pattern originale.',logs:[],seconds:0,started:null,materials:'',cost:0,photo:'',patternText:'',patternUrl:'https://www.youtube.com/watch?v=ZrJpROxw1DE'}],wishlist:[]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{state=structuredClone(initial)};let tab='projects',stepChecks={},actual='',note='',timerHandle=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const current=()=>state.projects.find(p=>p.id===state.selected)||state.projects[0];const calc=(p,row)=>{let prev=Math.max(0,Math.min(p.increases,Math.floor((row-1-p.offset)/p.interval)+1)),now=Math.max(0,Math.min(p.increases,Math.floor((row-p.offset)/p.interval)+1));return{before:p.initial+prev*(p.kind==='increase'?1:-1),after:p.initial+now*(p.kind==='increase'?1:-1),change:now>prev,done:now}};const show=n=>document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+n));function go(t){tab=t;render()}function render(){show(tab);if(tab==='projects')projectsView();if(tab==='work')workView();if(tab==='library')libraryView();if(tab==='settings')settingsView()};function projectsView(){let html=`<h2>I miei progetti</h2><div class="card soft"><strong>Benvenuta in EasyLoop ♡</strong><p class="notice">I tuoi dati restano su questo dispositivo. Esporta regolarmente un backup per non perdere i progressi.</p></div>`;state.projects.forEach(p=>{const c=calc(p,p.row);html+=`<div class="card"><div class="row"><div><h3>${esc(p.name)}</h3><small>${esc(p.status)} · Ferro ${p.row} · ${c.after} maglie previste</small></div>${p.photo?`<img class="photo" src="${p.photo}">`:'🧶'}</div><div class="space"></div><button class="btn" onclick="selectProject('${p.id}')">Apri progetto</button> <button class="btn secondary" onclick="editProject('${p.id}')">Modifica</button></div>`});html+=`<button class="btn full" onclick="newProject()">+ Nuovo progetto</button><div id="editor"></div>`;$('app').innerHTML=html}function selectProject(id){state.selected=id;save();stepChecks={};actual='';note='';go('work')}function newProject(){editProject(null)}function editProject(id){let p=id?state.projects.find(x=>x.id===id):null;$('editor').innerHTML=`<div class="card"><h3>${p?'Modifica progetto':'Nuovo progetto'}</h3><form id="projectForm"><label>Nome<input name="name" required value="${esc(p?.name||'')}"></label><label>Stato<select name="status"><option ${p?.status==='In corso'?'selected':''}>In corso</option><option ${p?.status==='Da iniziare'?'selected':''}>Da iniziare</option><option ${p?.status==='Completato'?'selected':''}>Completato</option></select></label><div class="grid"><label>Maglie iniziali<input name="initial" type="number" min="1" required value="${p?.initial??6}"></label><label>Ferro attuale<input name="row" type="number" min="1" required value="${p?.row??1}"></label><label>Ogni quanti ferri?<input name="interval" type="number" min="1" required value="${p?.interval??8}"></label><label>Numero aumenti/diminuzioni<input name="increases" type="number" min="0" required value="${p?.increases??15}"></label><label>Primo ferro con modifica<input name="offset" type="number" min="1" required value="${p?.offset??8}"></label><label>Tipo<select name="kind"><option value="increase" ${p?.kind!=='decrease'?'selected':''}>Increase</option><option value="decrease" ${p?.kind==='decrease'?'selected':''}>Decrease</option></select></label></div><label>Passaggi prima della modifica<input name="before" value="${esc(p?.before||'K2')}"></label><label>Tecnica increase/decrease<input name="technique" value="${esc(p?.technique||'KFB (da verificare)')}"></label><label>Passaggi dopo la modifica<textarea name="after">${esc(p?.after||'Knit fino a fine ferro')}</textarea></label><label>Istruzioni ferri normali<textarea name="regular">${esc(p?.regular||'Knit fino a fine ferro')}</textarea></label><details><summary>Altri dettagli</summary><label>Materiali<input name="materials" value="${esc(p?.materials||'')}"></label><label>Costo materiali (€)<input name="cost" type="number" step="0.01" min="0" value="${p?.cost||0}"></label><label>Note<textarea name="notes">${esc(p?.notes||'')}</textarea></label><label>URL tutorial / pattern<input name="patternUrl" type="url" value="${esc(p?.patternUrl||'')}"></label><label>Testo pattern personale<textarea name="patternText">${esc(p?.patternText||'')}</textarea></label><label>Foto progetto<input name="photoFile" type="file" accept="image/*"></label></details><button class="btn full" type="submit">Salva progetto</button>${p?`<button type="button" class="btn secondary full" style="margin-top:8px" onclick="removeProject('${p.id}')">Elimina progetto</button>`:''}</form></div>`;$('projectForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),obj=p||{id:'p'+Date.now(),logs:[],seconds:0,started:null,photo:''};['name','status','before','technique','after','regular','materials','notes','patternUrl','patternText','kind'].forEach(k=>obj[k]=f.get(k)||'');['initial','row','interval','increases','offset','cost'].forEach(k=>obj[k]=Number(f.get(k)));let file=f.get('photoFile');if(file?.size){if(file.size>1500000){alert('Foto troppo grande: massimo 1,5 MB.');return}obj.photo=await new Promise(resolve=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})}if(!p)state.projects.push(obj);state.selected=obj.id;try{save()}catch{alert('Memoria del dispositivo piena. Riduci le dimensioni della foto e riprova.');return}render()}}function removeProject(id){if(!confirm('Eliminare questo progetto e i suoi progressi?'))return;state.projects=state.projects.filter(p=>p.id!==id);state.selected=state.projects[0]?.id||'';save();render()}
function workView(){let p=current();if(!p){$('app').innerHTML='<p>Nessun progetto. Creane uno nella sezione Progetti.</p>';return}let c=calc(p,p.row),finished=c.done>=p.increases&&p.row>=p.offset+(p.increases-1)*p.interval;let tasks=c.change?[p.before,p.technique,p.after]:[p.regular];let checks=stepChecks[p.row]||[];let status=actual===''?'':Number(actual)===c.after?'ok':'mismatch';$('app').innerHTML=`<div class="row"><div><div class="tag">MODALITÀ GUIDATA</div><h2>${esc(p.name)}</h2></div><button class="btn secondary" onclick="go('projects')">Cambia</button></div><div class="card"><div class="row"><button class="btn secondary" onclick="changeRow(-1)" ${p.row<=1?'disabled':''}>−</button><div style="text-align:center"><small>FERRO ATTUALE</small><div class="big">${p.row}</div><span class="pill">${c.change?p.kind==='increase'?'↗ Increase row':'↘ Decrease row':'Regular row'}</span></div><button class="btn secondary" onclick="changeRow(1)">+</button></div></div><div class="grid"><div class="card soft"><small>Maglie a inizio ferro</small><div class="big">${c.before}</div></div><div class="card soft"><small>Maglie a fine ferro</small><div class="big">${c.after}</div><small>${c.change?(p.kind==='increase'?'+1':'−1'):'Nessuna variazione'}</small></div></div><div class="card"><h3>Cosa devi lavorare</h3>${tasks.map((s,i)=>`<label class="step ${checks.includes(i)?'done':''}"><input type="checkbox" ${checks.includes(i)?'checked':''} onchange="toggleStep(${i},this.checked)"><span><small>PASSAGGIO ${i+1}</small><br>${esc(s)}</span></label>`).join('')}<p class="notice">I passaggi sono personalizzabili. Verifica la tecnica sul tuo pattern originale.</p></div><div class="card"><h3>Controllo maglie</h3><p class="muted">Quante maglie hai davvero sul ferro alla fine della riga?</p><input type="number" min="0" id="actual" placeholder="Conta e inserisci le maglie" value="${esc(actual)}" oninput="actual=this.value;updateValidation()"><div id="validation"></div><div id="noteBox" class="hidden"><label>Nota sull'errore<textarea id="errorNote" placeholder="Es. Potrei aver saltato un aumento..." oninput="note=this.value">${esc(note)}</textarea></label><button class="btn secondary full" onclick="actual='';$('actual').value='';updateValidation()">↻ Riconta</button></div><button class="btn full" style="margin-top:12px" id="complete" onclick="completeRow()">Ferro completato →</button></div><div class="card"><div class="row"><strong>${p.kind==='increase'?'Increase':'Decrease'} completati</strong><strong>${Math.min(c.done,p.increases)} / ${p.increases}</strong></div><div class="space"></div><div class="progress"><span style="width:${p.increases?Math.min(100,c.done/p.increases*100):100}%"></span></div>${finished?'<p class="ok">Hai completato la fase impostata! Puoi continuare con il resto del pattern.</p>':''}</div><div class="card"><div class="row"><strong>⏱ Tempo di lavorazione</strong><strong id="timer">${formatTime(elapsed(p))}</strong></div><div class="space"></div><button class="btn secondary" onclick="toggleTimer()">${p.started?'Pausa':'Avvia timer'}</button></div><div class="card"><details><summary>Storico ferri e note (${p.logs.length})</summary>${p.logs.slice().reverse().map(l=>`<p><strong>Ferro ${l.row}</strong> · ${l.count}/${l.expected} maglie ${l.count===l.expected?'✓':'⚠'}<br><small>${esc(l.note||'Nessuna nota')}</small></p>`).join('')||'<p>Nessun ferro registrato.</p>'}</details>${p.patternUrl?`<p><a class="link" href="${esc(p.patternUrl)}" target="_blank" rel="noopener">Apri tutorial / pattern ↗</a></p>`:''}${p.notes?`<p class="notice">${esc(p.notes)}</p>`:''}</div>`;updateValidation()}
function toggleStep(i,on){let p=current(),s=stepChecks[p.row]||[];stepChecks[p.row]=on?[...new Set([...s,i])]:s.filter(x=>x!==i);updateValidation()}function changeRow(delta){let p=current();p.row=Math.max(1,p.row+delta);actual='';note='';save();render()}function updateValidation(){let p=current();if(tab!=='work'||!p)return;let c=calc(p,p.row),tasks=c.change?3:1,checked=(stepChecks[p.row]||[]).length===tasks,mismatch=actual!==''&&Number(actual)!==c.after;let el=$('validation');if(!el)return;el.innerHTML=actual===''?'<p class="notice">Il numero effettivo non viene compilato automaticamente.</p>':mismatch?`<div class="warn"><strong class="danger">⚠ Il conteggio non torna</strong><p>Previsto: ${c.after} · Contato: ${esc(actual)}. Riconta oppure aggiungi una nota e prosegui.</p></div>`:'<p class="ok">✓ Perfetto! Il conteggio corrisponde.</p>';$('noteBox').classList.toggle('hidden',!mismatch);$('complete').disabled=!checked||actual===''||(mismatch&&!note.trim())}function completeRow(){let p=current(),c=calc(p,p.row),mismatch=Number(actual)!==c.after;if(mismatch&&!note.trim())return;p.logs.push({row:p.row,count:Number(actual),expected:c.after,note:note.trim(),date:new Date().toISOString()});p.row++;actual='';note='';save();render()}function elapsed(p){return (p.seconds||0)+(p.started?Math.floor((Date.now()-p.started)/1000):0)}function formatTime(s){return `${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m ${String(s%60).padStart(2,'0')}s`}function toggleTimer(){let p=current();if(p.started){p.seconds=elapsed(p);p.started=null}else p.started=Date.now();save();render()}setInterval(()=>{let p=current();if(tab==='work'&&p?.started&&$('timer'))$('timer').textContent=formatTime(elapsed(p))},1000);
function libraryView(){let p=current();$('app').innerHTML=`<h2>Pattern & tutorial</h2><div class="card"><h3>${esc(p?.name||'Nessun progetto')}</h3>${p?.patternUrl?`<p><a href="${esc(p.patternUrl)}" target="_blank" rel="noopener" class="link">Apri video o link del pattern ↗</a></p>`:''}${p?.patternText?`<p style="white-space:pre-wrap">${esc(p.patternText)}</p>`:'<p class="notice">Inserisci le istruzioni del tuo pattern nella modifica del progetto.</p>'}<label>Allega PDF al progetto attuale<input id="pdf" type="file" accept="application/pdf" onchange="storePDF(this.files[0])"></label><button class="btn secondary" onclick="openPDF()">Apri PDF salvato</button><p class="notice">Il PDF è archiviato sul dispositivo tramite IndexedDB. Il backup JSON include i dati dei progetti, ma non i PDF: esportali separatamente.</p></div><div class="card"><h3>Glossario beginner</h3><p><b>K / Knit:</b> maglia a diritto</p><p><b>P / Purl:</b> maglia a rovescio</p><p><b>KFB:</b> knit front and back, aumento lavorando davanti e dietro la stessa maglia</p><p><b>Inc / Dec:</b> aumento / diminuzione</p><p><b>Slip purlwise:</b> passa la maglia senza lavorarla, come per lavorarla a rovescio</p></div>`}
const db=()=>new Promise((resolve,reject)=>{let q=indexedDB.open('easyloop-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('pdfs');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});async function storePDF(file){if(!file)return;if(file.type!=='application/pdf'){alert('Seleziona un PDF.');return}try{let d=await db(),t=d.transaction('pdfs','readwrite');t.objectStore('pdfs').put(file,current().id);t.oncomplete=()=>alert('PDF salvato su questo dispositivo.');t.onerror=()=>alert('Impossibile salvare il PDF.')}catch{alert('Archiviazione PDF non disponibile.')}}async function openPDF(){try{let d=await db(),t=d.transaction('pdfs','readonly'),q=t.objectStore('pdfs').get(current().id);q.onsuccess=()=>{if(!q.result)return alert('Nessun PDF salvato per questo progetto.');let url=URL.createObjectURL(q.result);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch{alert('PDF non disponibile.')}}
function settingsView(){$('app').innerHTML=`<h2>Backup e impostazioni</h2><div class="card"><h3>Salva i tuoi progressi</h3><p class="notice">EasyLoop salva automaticamente i progetti in questo browser. La cancellazione dei dati del sito o l'uso di un altro dispositivo può farli perdere. Esporta spesso un backup.</p><button class="btn full" onclick="exportBackup()">↓ Esporta backup JSON</button><label>Ripristina backup<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"></label></div><div class="card"><h3>Statistiche</h3><p>Progetti: <b>${state.projects.length}</b></p><p>Ferri registrati: <b>${state.projects.reduce((s,p)=>s+p.logs.length,0)}</b></p><p>Costi materiali: <b>€ ${state.projects.reduce((s,p)=>s+(p.cost||0),0).toFixed(2)}</b></p><p>Tempo totale: <b>${formatTime(state.projects.reduce((s,p)=>s+elapsed(p),0))}</b></p></div><div class="card"><h3>Installazione su iPhone</h3><p>Pubblica questa cartella su un sito HTTPS (ad esempio GitHub Pages), apri l'indirizzo in Safari e scegli <b>Condividi → Aggiungi alla schermata Home</b>.</p><p class="notice">Aprire direttamente il file HTML non permette una vera installazione PWA. Nessun account, abbonamento o server per i tuoi dati.</p></div>`}function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='easyloop-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importBackup(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.projects))throw Error();if(!confirm('Sostituire tutti i progetti attuali con il backup?'))return;state=data;save();render();alert('Backup ripristinato.')}catch{alert('Backup non valido o memoria insufficiente.')}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
